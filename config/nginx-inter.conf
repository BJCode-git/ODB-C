user www-data;
worker_processes 1;
pid /run/nginx-inter.pid;
include /etc/nginx/modules-enabled/*.conf;
#/etc/nginx/modules-enabled/*
worker_rlimit_nofile 65535;

events {
    use poll;
    worker_connections 1000;
}

http {
    proxy_read_timeout 2s;
    keepalive_requests 1000;

    aio off;
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_header_buffer_size 1k;
    large_client_header_buffers 1 2k;
    client_body_buffer_size 128k;
    
    proxy_buffer_size 256K;
    proxy_busy_buffers_size 256K;
    proxy_buffers 4 256K;
    proxy_buffering off;

    access_log /home/julien/Cours/Cours3A/Stage3A/Dev/ODBc-Project/NEWODB/debug/access-inter.log;
    error_log /home/julien/Cours/Cours3A/Stage3A/Dev/ODBc-Project/NEWODB/debug/error-inter.log debug;

    upstream backend_server {
        server localhost:42002;
        keepalive 10;
    }

    server {
        listen 42001 reuseport;
        server_name localhost;

        location / {
            proxy_pass http://backend_server;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_cache off;
            #proxy_set_header Host $host;
            #proxy_set_header X-Real-IP $remote_addr;
            #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}